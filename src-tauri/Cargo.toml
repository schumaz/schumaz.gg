[package]
name = "schumazgg"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "schumazgg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
irelia = { version = "0.11.2", features = ["full", "ws"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
hyper-rustls = "0.27.10"
rustls = { version = "0.23.46", features = ["ring"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[profile.dev]
incremental = true

[dev-dependencies]
wiremock = "0.6.5"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[package]
name = "schumazgg"
version = "0.5.1"
description = "Automated League of Legends companion app for builds, runes, spells, item sets, and summoner stats."
authors = ["schumaZ"]
license = "GPL-3.0-only"
edition = "2024"
default-run = "schumazgg"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "schumazgg_lib"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "schumazgg"
path = "src/main.rs"
test = false

[features]
default = []
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
schumaz-models = { path = "crates/schumaz-models" }
schumaz-domain = { path = "crates/schumaz-domain" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.28"
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
irelia = { version = "0.11.2", features = ["full", "ws"] }
tungstenite = { version = "0.26", features = ["__rustls-tls"] }
http = "1.2"
sysinfo = "0.33"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
hyper-rustls = { version = "0.27.10", features = ["ring"] }
rustls = { version = "0.23.46", features = ["ring"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[dev-dependencies]
wiremock = "0.6.5"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[workspace]
members = [".", "crates/schumaz-models", "crates/schumaz-domain"]
default-members = [".", "crates/schumaz-models", "crates/schumaz-domain"]
resolver = "2"

[package]
name = "schumazgg"
version = "0.3.3"
description = "Automated League of Legends companion app for builds, runes, spells, item sets, and summoner stats."
authors = ["schumaZ"]
license = "GPL-3.0-only"
edition = "2024"
default-run = "schumazgg"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "schumazgg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
lz4_flex = "0.11"
specta = "=2.0.0-rc.28"
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
irelia = { version = "0.11.2", features = ["full", "ws"] }
http = "1.2"
sysinfo = "0.33"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
hyper-rustls = { version = "0.27.10", features = ["ring"] }
rustls = { version = "0.23.46", features = ["ring"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[profile.dev]
incremental = true

[dev-dependencies]
wiremock = "0.6.5"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

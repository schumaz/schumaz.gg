[package]
name = "schumaz-domain"
version = "0.5.1"
description = "Pure domain services, caches, parsers, injection logic, and update policies for schumaz.gg."
authors = ["schumaZ"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "schumaz_domain"
crate-type = ["rlib"]
doctest = false

[dependencies]
bytes = "1.12.1"
http = "1.2"
lz4_flex = "0.11"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
rmp-serde = "1"
schumaz-models = { path = "../schumaz-models" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
wiremock = "0.6.5"

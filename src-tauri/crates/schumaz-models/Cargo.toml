[package]
name = "schumaz-models"
version = "0.5.1"
description = "Shared IPC and domain data contracts and TypeScript bindings exporter for schumaz.gg."
authors = ["schumaZ"]
license = "GPL-3.0-only"
edition = "2024"
default-run = "export_bindings"

[lib]
name = "schumaz_models"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
test = false

[dependencies]
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-serde = "0.0.15"
specta-typescript = "0.0.15"
specta-util = "0.0.15"
